apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress
  namespace: argocd
spec:
  project: rtdp
  sources:
    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      path: deploy/helm/rtdp-service
      helm:
        valueFiles:
          - $values/deploy/argocd/values/sandbox.yaml
        values: |
          image:
            repository: 079457921611.dkr.ecr.us-east-1.amazonaws.com/rtdp/ingress
            digest: "sha256:643654a4bf56fda6eece539f4995490a6f9adea138d8bbac69e743195313307d"
          service:
            port: 8080
            # service.public (NLB) is intentionally unset: the permission
            # boundary denies iam:CreateServiceLinkedRole, so no ELB can be
            # provisioned in this account. Demo access = port-forward or a
            # local tunnel (cloudflared/ngrok) on top of it.
          probe:
            httpPath: /healthz
          env:
            RTDP_ORCHESTRATOR_ADDR: orchestrator.rtdp.svc.cluster.local:50055
            RTDP_DECIDE_TIMEOUT_MS: "35000" # bound only; product deadline governs

    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rtdp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
