apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress
  namespace: argocd
spec:
  project: rtdp
  sources:
    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      path: deploy/helm/rtdp-service
      helm:
        valueFiles:
          - $values/deploy/argocd/values/sandbox.yaml
        values: |
          image:
            repository: 079457921611.dkr.ecr.us-east-1.amazonaws.com/rtdp/ingress
            digest: "sha256:53ee36ec90d57f08d767f3efc2e7e769a8ee6b2e84a618bc715b60fb50810218"
          service:
            port: 8080
            public:
              annotations:
                service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
              sourceRanges: ["70.18.235.134/32"] # operator IP — demo endpoint
          probe:
            httpPath: /healthz
          env:
            RTDP_ORCHESTRATOR_ADDR: orchestrator.rtdp.svc.cluster.local:50055
            RTDP_DECIDE_TIMEOUT_MS: "35000" # bound only; product deadline governs

    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rtdp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
