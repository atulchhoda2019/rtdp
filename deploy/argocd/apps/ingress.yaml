apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress
  namespace: argocd
spec:
  project: rtdp
  sources:
    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      path: deploy/helm/rtdp-service
      helm:
        valueFiles:
          - $values/deploy/argocd/values/sandbox.yaml
        values: |
          image:
            repository: 079457921611.dkr.ecr.us-east-1.amazonaws.com/rtdp/ingress
            digest: "sha256:5f746ab07c9240291919f7e1fda6f9c6f2b73f8c617158b58b3f8a65944f7b45"
          service:
            port: 8080
          probe:
            httpPath: /healthz
          env:
            RTDP_ORCHESTRATOR_ADDR: orchestrator.rtdp.svc.cluster.local:50055
            RTDP_DECIDE_TIMEOUT_MS: "35000" # bound only; product deadline governs

    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rtdp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
