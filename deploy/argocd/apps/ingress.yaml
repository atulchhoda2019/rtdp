apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress
  namespace: argocd
spec:
  project: rtdp
  sources:
    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      path: deploy/helm/rtdp-service
      helm:
        valueFiles:
          - $values/deploy/argocd/values/sandbox.yaml
        values: |
          image:
            repository: 079457921611.dkr.ecr.us-east-1.amazonaws.com/rtdp/ingress
            digest: "sha256:6359a4898868e1b6a53aa8977eaf3481c6c9d65c51a9949ded88686baa083700"
          service:
            port: 8080
            # service.public (NLB) is intentionally unset: the permission
            # boundary denies iam:CreateServiceLinkedRole, so no ELB can be
            # provisioned in this account. Demo access = port-forward or a
            # local tunnel (cloudflared/ngrok) on top of it.
          probe:
            httpPath: /healthz
          env:
            RTDP_ORCHESTRATOR_ADDR: orchestrator.rtdp.svc.cluster.local:50055
            # ADR-013: delegation-token JWS is verified against the
            # registry JWKS; without this it defaults to localhost and
            # every delegated call declines UNAUTHORIZED.
            RTDP_AGENT_REGISTRY_ADDR: http://agent-registry.rtdp.svc.cluster.local:8090
            RTDP_DECIDE_TIMEOUT_MS: "35000" # bound only; product deadline governs

    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rtdp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
