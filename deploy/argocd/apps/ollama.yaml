apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
spec:
  project: rtdp
  sources:
    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      path: deploy/helm/rtdp-service
      helm:
        valueFiles:
          - $values/deploy/argocd/values/sandbox.yaml
        values: |
          image:
            repository: ollama/ollama
            digest: "sha256:SET_BY_PUSH_IMAGES"
          service:
            port: 11434
          env:
            OLLAMA_HOST: 0.0.0.0
          initContainers:
            - name: model-pull
              image: ollama/ollama@sha256:SET_BY_PUSH_IMAGES
              command: ["sh", "-c", "ollama serve & for i in $(seq 60); do ollama list >/dev/null 2>&1 && break; sleep 1; done; ollama pull qwen2.5:0.5b && pkill -f 'ollama serve' || true"]
              volumeMounts: [{name: models, mountPath: /root/.ollama}]
          volumes: [{name: models, emptyDir: {}}]
          volumeMounts: [{name: models, mountPath: /root/.ollama}]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }

    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rtdp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
