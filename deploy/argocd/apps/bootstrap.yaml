apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rtdp-bootstrap
  namespace: argocd
spec:
  project: rtdp
  sources:
    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      path: deploy/helm/rtdp-bootstrap
      helm:
        valueFiles:
          - $values/deploy/argocd/values/sandbox.yaml
    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rtdp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
