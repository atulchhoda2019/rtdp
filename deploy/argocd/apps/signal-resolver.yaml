apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signal-resolver
  namespace: argocd
spec:
  project: rtdp
  sources:
    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      path: deploy/helm/rtdp-service
      helm:
        valueFiles:
          - $values/deploy/argocd/values/sandbox.yaml
        values: |
          image:
            repository: 079457921611.dkr.ecr.us-east-1.amazonaws.com/rtdp/signal-resolver
            digest: "sha256:2ea29f3dca24eaa18138c98cbeee085abb601a2c2bc89595ce6e5e817c058248"
          service:
            port: 50054
          env:
            RTDP_RESOLVER_PORT: "50054"
            RTDP_INFERENCE_ADDR: inference-service.rtdp.svc.cluster.local:50051
            RTDP_SLM_ADDR: slm-service.rtdp.svc.cluster.local:50056

    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rtdp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
