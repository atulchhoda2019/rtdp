apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slm-service
  namespace: argocd
spec:
  project: rtdp
  sources:
    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      path: deploy/helm/rtdp-service
      helm:
        valueFiles:
          - $values/deploy/argocd/values/sandbox.yaml
        values: |
          image:
            repository: 079457921611.dkr.ecr.us-east-1.amazonaws.com/rtdp/slm-service
            digest: "sha256:f2f0dc99c5a3896e05c7757776e21af8a9d884760726b4b739fc2e4a91ed1240"
          service:
            port: 50056
          env:
            RTDP_SLM_PORT: "50056"
            RTDP_OLLAMA_ADDR: http://ollama.rtdp.svc.cluster.local:11434

    - repoURL: https://github.com/atulchhoda2019/rtdp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rtdp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
