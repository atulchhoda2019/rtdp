apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slm-service
  namespace: argocd
spec:
  project: rtdp
  source:
    repoURL: https://github.com/atulchhoda2019/rtdp.git
    targetRevision: main
    path: deploy/helm/rtdp-service
    helm:
      values: |
        image:
          repository: 079457921611.dkr.ecr.us-east-1.amazonaws.com/rtdp/slm-service
          digest: "sha256:SET_BY_CI_OR_STAGE_F"
        service:
          port: 50056
        env:
          RTDP_POSTGRES_DSN_SECRET: "rtdp-db"   # resolved via External Secrets at Stage F
          RTDP_KAFKA_BROKERS: 'SET_AT_STAGE_F'
          RTDP_REDIS_ADDR: 'SET_AT_STAGE_F'
          RTDP_SLM_PROVIDER: 'bedrock'
  destination:
    server: https://kubernetes.default.svc
    namespace: rtdp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
