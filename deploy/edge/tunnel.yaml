# In-cluster edge tunnel — the account's permission boundary denies
# iam:CreateServiceLinkedRole, so no ELB can front the cluster. A
# cloudflared quick tunnel publishes ingress over an outbound QUIC
# connection instead: public https URL, no inbound holes, no SLR.
# The URL is ephemeral per pod start; read it from the pod logs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-tunnel
  namespace: rtdp
  labels:
    app.kubernetes.io/name: edge-tunnel
    app.kubernetes.io/part-of: rtdp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-tunnel
        app.kubernetes.io/part-of: rtdp
    spec:
      nodeSelector:
        rtdp.io/pool: cpu-inference
      tolerations:
        - key: rtdp.io/inference
          operator: Equal
          value: cpu
          effect: NoSchedule
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c # 2026.9.3
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --url
            - http://ingress.rtdp.svc.cluster.local:8080
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            tcpSocket: { port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
