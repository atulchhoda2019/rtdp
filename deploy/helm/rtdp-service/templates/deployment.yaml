apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rtdp.name" . }}
  labels: {{- include "rtdp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "rtdp.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "rtdp.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.metricsPort }}"
    spec:
      serviceAccountName: {{ include "rtdp.saName" . }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if or .Values.initContainers .Values.bundleSync.enabled }}
      initContainers:
        {{- if .Values.bundleSync.enabled }}
        - name: bundle-sync
          image: {{ .Values.bundleSync.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "aws s3 sync s3://{{ .Values.bundleSync.bucket }}/bundles/ /bundles/ --only-show-errors"]
          env:
            - { name: AWS_REGION, value: "us-east-1" }
          volumeMounts: [{ name: bundles, mountPath: /bundles }]
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if or .Values.volumes .Values.bundleSync.enabled }}
      volumes:
        {{- if .Values.bundleSync.enabled }}
        - name: bundles
          emptyDir: {}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            {{- if .Values.service.port }}
            - name: svc
              containerPort: {{ .Values.service.port }}
            {{- end }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            - name: RTDP_ENV
              value: "aws-sandbox"
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.envFromSecrets }}
          envFrom:
            {{- range .Values.envFromSecrets }}
            - secretRef: { name: {{ .name }} }
            {{- end }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.volumeMounts .Values.bundleSync.enabled }}
          volumeMounts:
            {{- if .Values.bundleSync.enabled }}
            - { name: bundles, mountPath: /bundles }
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.probe.httpPath }}
          livenessProbe:
            httpGet: { path: {{ .Values.probe.httpPath }}, port: svc }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: {{ .Values.probe.httpPath }}, port: svc }
            initialDelaySeconds: 3
          {{- else if .Values.service.port }}
          livenessProbe:
            tcpSocket: { port: svc }
            initialDelaySeconds: 5
          readinessProbe:
            tcpSocket: { port: svc }
            initialDelaySeconds: 3
          {{- end }}
