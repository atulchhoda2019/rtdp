# Aurora managed master secret -> k8s Secret `rtdp-db` with a ready-to-use
# DSN. Credentials never transit the repo or the agent transcript.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rtdp-db
  namespace: rtdp
  labels:
    app.kubernetes.io/part-of: rtdp
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: rtdp-db
    template:
      engineVersion: v2
      data:
        RTDP_POSTGRES_DSN: 'postgres://{{`{{ .username }}`}}:{{`{{ .password }}`}}@{{ .Values.bootstrap.auroraEndpoint }}:5432/{{ .Values.bootstrap.databaseName }}?sslmode=require'
  dataFrom:
    - extract:
        key: {{ .Values.bootstrap.auroraSecretArn | quote }}
