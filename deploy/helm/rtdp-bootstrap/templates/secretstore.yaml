# SecretStore backed by AWS Secrets Manager. No auth block: the ESO
# controller's Pod Identity (default SDK chain) reads the declared ARNs.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: rtdp
  labels:
    app.kubernetes.io/part-of: rtdp
    app.kubernetes.io/managed-by: argocd
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
