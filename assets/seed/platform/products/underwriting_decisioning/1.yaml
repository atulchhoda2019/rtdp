# Platform-owned product definition. Synthetic demo configuration only.
product_id: underwriting_decisioning
version: 1
owner_scope: platform
runtime_profile: policy_application
routing:
  event_types: [POLICY_APPLICATION]
  channels: [PORTAL, BROKER]
execution:
  total_deadline_ms: 100
  required_features:
    - claimant_claim_count_1h@1
    - claimant_amount_sum_24h@1
    - provider_claim_count_1h@1
    - provider_amount_sum_1h@1
  signals:
    uw:
      contract: underwriting.eligibility_probability
      accepted_contracts: ["1.0.0"]
      binding: uw-eligibility-primary@1
      timeout_ms: 40
      required: true
  ruleset: uw_policy@1
  missing_required_signal: REVIEW
  aggregation: decision_precedence@1
thresholds:
  bind_probability: 0.75
  decline_probability: 0.35
  velocity_decline_count: 8
action_policy: uw_actions@1
rollout:
  mode: LIVE
  cohort: champion
