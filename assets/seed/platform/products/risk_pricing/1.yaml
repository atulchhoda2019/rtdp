# Platform-owned product definition. Synthetic demo configuration only.
product_id: risk_pricing
version: 1
owner_scope: platform
runtime_profile: quote_request
routing:
  event_types: [QUOTE_REQUEST]
  channels: [PORTAL, BROKER]
execution:
  total_deadline_ms: 100
  required_features:
    - claimant_claim_count_1h@1
    - claimant_amount_sum_24h@1
    - provider_claim_count_1h@1
    - provider_amount_sum_1h@1
  signals:
    pricing:
      contract: pricing.premium_estimate
      accepted_contracts: ["1.0.0"]
      binding: premium-linear-primary@1
      timeout_ms: 40
      required: true
  ruleset: pricing_policy@1
  missing_required_signal: REVIEW
  aggregation: decision_precedence@1
thresholds:
  max_auto_quote: 5000.0
  min_auto_quote: 50.0
action_policy: quote_actions@1
rollout:
  mode: LIVE
  cohort: champion
