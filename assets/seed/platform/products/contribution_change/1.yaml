# Platform-owned product definition. Synthetic demo configuration only.
# Benefits product — retirement contribution/distribution change.
# Rules-only product: no model signal; tier-1 velocity/amount features
# carry the account-takeover heuristic (see docs/validation/phase3-gaps.md).
product_id: contribution_change
version: 1
owner_scope: platform
runtime_profile: decisioning
routing:
  event_types: [CONTRIBUTION_CHANGE]
  channels: [PORTAL, BROKER]
execution:
  total_deadline_ms: 100
  required_features:
    - claimant_claim_count_1h@1
    - claimant_amount_sum_24h@1
  ruleset: contribution_policy@1
  missing_required_signal: APPROVE
  aggregation: decision_precedence@1
thresholds:
  fraud_max_history: 1       # count_1h <= 1 means first-ever request
  fraud_amount: 5000.0       # large change by a first-time participant
  plan_limit_24h: 25000.0
action_policy: contribution_actions@1
rollout:
  mode: LIVE
  cohort: champion
