feature_name: provider_amount_sum_1h
version: 1
tier: tier2
description: "Sum of claimed amounts at this provider+currency in the trailing hour (event time, 1-minute tiles)."
entity: provider_id_currency
value_type: float64
computation:
  kind: event_time_window
  tile: PT1M
  window: PT1H
  out_of_orderness: PT2S
  allowed_lateness: PT1M
  idleness_timeout: PT10S
  aggregate: sum
scope: [tenant, mode, provider_id, currency, feature_version]
staleness_policy:
  max_pipeline_staleness: PT30S
