feature_name: claimant_amount_sum_24h
version: 1
tier: tier1
description: "Sum of claimed amounts by this claimant+currency in the trailing 24 hours (processing time)."
entity: tokenized_claimant_currency
value_type: float64
computation:
  kind: sync_sum
  window: PT24H
  bucket: minute
  dedup_horizon: PT24H
scope: [tenant, environment, mode, tokenized_claimant, currency]
staleness_policy:
  max_age: PT0S
