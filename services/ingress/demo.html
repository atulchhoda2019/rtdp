<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTDP — decision demo</title>
<style>
  body { font-family: ui-monospace, Menlo, monospace; background:#0d1117;
         color:#c9d1d9; max-width:760px; margin:2em auto; padding:0 1em; }
  h1 { font-size:1.2em; color:#58a6ff; }
  label { display:block; margin-top:.8em; font-size:.85em; color:#8b949e; }
  select, input, button { width:100%; padding:.45em; margin-top:.25em;
         background:#161b22; color:#c9d1d9; border:1px solid #30363d;
         border-radius:6px; font-family:inherit; font-size:.95em; }
  button { background:#238636; color:#fff; border:none; margin-top:1.2em;
         cursor:pointer; font-weight:600; }
  button:disabled { background:#30363d; cursor:wait; }
  #out { margin-top:1.5em; padding:1em; background:#161b22;
         border:1px solid #30363d; border-radius:6px; white-space:pre-wrap;
         word-break:break-all; font-size:.85em; min-height:3em; }
  .APPROVE { color:#3fb950; } .REVIEW { color:#d29922; } .DECLINE { color:#f85149; }
  #meta { font-size:.75em; color:#8b949e; margin-top:.4em; }
</style>
</head>
<body>
<h1>RTDP — real-time decisioning (synthetic sandbox)</h1>
<label>Tenant client
  <select id="client">
    <option>demo-client-a</option>
    <option>demo-client-b</option>
  </select></label>
<label>Event type
  <select id="event">
    <option>CLAIM_SUBMISSION</option>
    <option>POLICY_APPLICATION</option>
    <option>QUOTE_REQUEST</option>
    <option>CLAIM_DOCUMENT_INTAKE</option>
  </select></label>
<label>Amount (USD)
  <input id="amount" type="number" value="2500"></label>
<label>Claimant token
  <input id="claimant" value="tok_demo"></label>
<button id="go">Submit decision</button>
<div id="out">—</div>
<div id="meta"></div>
<script>
const $ = id => document.getElementById(id);
let n = 0;
$("go").onclick = async () => {
  $("go").disabled = true; $("out").textContent = "deciding…"; $("meta").textContent = "";
  const t0 = performance.now();
  const body = {
    transaction_id: "ui_" + Date.now() + "_" + (n++),
    transaction_revision: 1,
    event_type: $("event").value,
    channel: "PORTAL", region: "us-east-1",
    tokenized_claimant: $("claimant").value,
    provider_id: "prv_demo", currency: "USD",
    amount: parseFloat($("amount").value) || 0,
    event_time: new Date().toISOString(),
  };
  try {
    const r = await fetch("/v1/decide", {
      method: "POST",
      headers: {"Content-Type": "application/json",
                "X-RTDP-Client-Id": $("client").value},
      body: JSON.stringify(body),
    });
    const j = await r.json();
    const ms = Math.round(performance.now() - t0);
    if (r.ok) {
      const cls = (j.outcome || "").replace("DECISION_", "");
      $("out").innerHTML =
        `<span class="${cls}">${j.outcome}</span>  ` +
        `${(j.reason_codes || []).join(", ") || "—"}\n` +
        `decision_id   ${j.decision_id}\n` +
        `bundle_digest ${j.bundle_digest}\n` +
        `manifest_epoch ${j.manifest_epoch}   action_intents ${j.action_intents}`;
      $("meta").textContent = `${ms} ms  ·  http ${r.status}`;
    } else {
      $("out").textContent = `http ${r.status}\n` + (j.error || JSON.stringify(j));
      $("meta").textContent = `${ms} ms`;
    }
  } catch (e) { $("out").textContent = "network error: " + e; }
  $("go").disabled = false;
};
</script>
</body>
</html>
