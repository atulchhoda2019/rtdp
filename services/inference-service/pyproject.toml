[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtdp-inference-service"
version = "0.1.0"
description = "RTDP ONNX inference service (SignalProvider: grpc_inference)"
requires-python = ">=3.11"
dependencies = [
  "onnxruntime>=1.19,<2",
  "numpy>=2.0,<3",
  "protobuf>=6.33,<7",
  "grpcio>=1.68,<2",
  "boto3>=1.35,<2",
]

[tool.setuptools.packages.find]
include = ["rtdp_inference*"]
